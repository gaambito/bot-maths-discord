name: Envoi Quotidien Maths Double

on:
  schedule:
    # 1. Défi : Lundi au Vendredi à 17h00 UTC (18h00 CET/CEST)
    - cron: '0 17 * * 1-5' 
    # 2. Correction : Lundi au Vendredi à 19h00 UTC (20h00 CET/CEST)
    - cron: '0 19 * * 1-5' 
  workflow_dispatch:

jobs:
  job_challenge:
    # Ce job s'exécute si le cron de 17h00 se déclenche, ou si l'on lance manuellement.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 17 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Préparer l'environnement
        run: |
          pip install requests argparse

      - name: Lancer le Défi (Génération et Sauvegarde)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python daily_math.py challenge
        
      - name: Téléverser l'Artifact des données
        uses: actions/upload-artifact@v3
        with:
          name: math-data
          path: data.json
          # Conserver l'artifact pendant seulement 1 jour
          retention-days: 1

  job_correction:
    # Ce job s'exécute si le cron de 19h00 se déclenche.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 19 * * 1-5'
    runs-on: ubuntu-latest
    needs: job_challenge # Assure que ce job ne se lance que si job_challenge a eu lieu (surtout pour le test manuel)

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Télécharger l'Artifact des données
        uses: actions/download-artifact@v3
        with:
          name: math-data

      - name: Préparer l'environnement
        run: |
          pip install requests argparse

      - name: Lancer la Correction (Lecture et Envoi)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python daily_math.py correction
